<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Preview of the CONNECT WITH ME 3D sports car experience">
  <title>Connect with me — 3D sports car experience</title>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08122a"/><stop offset="0.55" stop-color="#0a1730"/><stop offset="1" stop-color="#0b1c3a"/></linearGradient>
    <linearGradient id="cborder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff" stop-opacity=".9"/><stop offset="1" stop-color="#ff354f" stop-opacity=".7"/></linearGradient>
    <linearGradient id="cbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2c58"/><stop offset="0.55" stop-color="#12224a"/><stop offset="1" stop-color="#0a1430"/></linearGradient>
    <linearGradient id="cglass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f5aa8" stop-opacity=".55"/><stop offset="1" stop-color="#0a1a3a" stop-opacity=".6"/></linearGradient>
    <radialGradient id="cglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#247bff" stop-opacity=".55"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="cred" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff354f" stop-opacity=".5"/><stop offset="1" stop-color="#ff354f" stop-opacity="0"/></radialGradient>
    <radialGradient id="cshad" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <pattern id="cdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".05"/></pattern>
    <filter id="cblur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect x="0" y="0" width="1000" height="560" rx="26" fill="url(#cbg)"/>
  <rect x="0" y="0" width="1000" height="560" rx="26" fill="url(#cdots)"/>
  <rect x=".75" y=".75" width="998.5" height="558.5" rx="26" fill="none" stroke="url(#cborder)" stroke-width="1.5"/>

  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <circle cx="44" cy="40" r="6" fill="#ff354f"/><circle cx="66" cy="40" r="6" fill="#5a6c96"/><circle cx="88" cy="40" r="6" fill="#247bff"/>
    <text x="112" y="45" font-size="15" fill="#6f83ad" letter-spacing="3">CONNECT WITH ME</text>
    <text x="956" y="45" font-size="13" fill="#5b8bff" text-anchor="end">3D &#183; drag to rotate</text>
  </g>

  <ellipse cx="500" cy="452" rx="330" ry="26" fill="url(#cshad)"/>
  <ellipse cx="250" cy="410" rx="150" ry="60" fill="url(#cglow)"/>
  <ellipse cx="770" cy="410" rx="140" ry="60" fill="url(#cred)"/>

  <g>
    <!-- body -->
    <path d="M175,404 L182,362 Q210,344 300,338 L470,330 Q520,296 606,296 L726,304 Q792,312 822,342 L836,376 L834,404 Z"
          fill="url(#cbody)" stroke="#2b3f6f" stroke-width="1.4"/>
    <!-- greenhouse -->
    <path d="M470,330 Q518,302 604,302 L716,309 L640,352 L486,352 Z" fill="url(#cglass)" stroke="#3a5590" stroke-width="1.2"/>
    <!-- side accent -->
    <path d="M250,372 L760,362" stroke="#247bff" stroke-width="2.4" opacity=".85"/>
    <!-- headlight -->
    <path d="M182,362 q-6,-10 12,-14 l18,6 z" fill="#bfe0ff"/>
    <ellipse cx="176" cy="360" rx="26" ry="16" fill="url(#cglow)"/>
    <!-- taillight -->
    <rect x="824" y="366" width="12" height="22" rx="3" fill="#ff354f"/>
    <ellipse cx="834" cy="378" rx="30" ry="18" fill="url(#cred)"/>
    <!-- rear wing -->
    <rect x="742" y="330" width="86" height="7" rx="3" fill="#0a1430" stroke="#2b3f6f"/>
    <rect x="770" y="336" width="7" height="22" fill="#0a1430"/>
    <!-- wheels -->
    <g>
      <circle cx="300" cy="416" r="46" fill="#05070f" stroke="#1a2b52" stroke-width="9"/>
      <circle cx="300" cy="416" r="22" fill="#101f44" stroke="#c9d6f0" stroke-width="4"/>
      <circle cx="300" cy="416" r="8" fill="#247bff"/>
    </g>
    <g>
      <circle cx="716" cy="416" r="46" fill="#05070f" stroke="#1a2b52" stroke-width="9"/>
      <circle cx="716" cy="416" r="22" fill="#101f44" stroke="#c9d6f0" stroke-width="4"/>
      <circle cx="716" cy="416" r="8" fill="#247bff"/>
    </g>
  </g>

  <!-- window hotspot labels -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">
    <g>
      <rect x="500" y="228" width="128" height="30" rx="15" fill="#0d1730" stroke="#2a3f70"/>
      <text x="564" y="247" fill="#9fb8ff" text-anchor="middle">LinkedIn &#183; 2</text>
      <line x1="564" y1="258" x2="548" y2="300" stroke="#2a3f70" stroke-dasharray="3 3"/>
    </g>
    <g>
      <rect x="700" y="228" width="128" height="30" rx="15" fill="#0d1730" stroke="#2a3f70"/>
      <text x="764" y="247" fill="#9fb8ff" text-anchor="middle">YouTube &#183; 2</text>
      <line x1="740" y1="258" x2="700" y2="300" stroke="#2a3f70" stroke-dasharray="3 3"/>
    </g>
    <g>
      <rect x="120" y="228" width="120" height="30" rx="15" fill="#0d1730" stroke="#2a3f70"/>
      <text x="180" y="247" fill="#9fb8ff" text-anchor="middle">Email</text>
      <line x1="220" y1="258" x2="240" y2="300" stroke="#2a3f70" stroke-dasharray="3 3"/>
    </g>
    <g>
      <rect x="330" y="228" width="120" height="30" rx="15" fill="#0d1730" stroke="#2a3f70"/>
      <text x="390" y="247" fill="#9fb8ff" text-anchor="middle">GitHub</text>
      <line x1="360" y1="258" x2="360" y2="300" stroke="#2a3f70" stroke-dasharray="3 3"/>
    </g>
  </g>

  <text x="500" y="520" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#6f83ad" text-anchor="middle">Rotate the car &#183; every window, light and bumper is a live link</text>
</svg>
