  <g font-family="Segoe UI,system-ui,sans-serif">
    <g>
      <rect x="150" y="330" width="320" height="96" rx="14" fill="url(#jchip)" stroke="#22355f"/>
      <text x="170" y="358" fill="#f4f6fc" font-size="16" font-weight="700">Campus Ninja</text>
      <text x="450" y="356" fill="#ff354f" font-size="11" text-anchor="end" font-family="ui-monospace,Menlo,monospace">BUILD</text>
      <text x="170" y="382" fill="#8496bd" font-size="12" font-family="ui-monospace,Menlo,monospace">student academic resource platform</text>
      <rect x="170" y="392" width="66" height="22" rx="11" fill="#0f1b36" stroke="#1c2c50"/>
      <text x="203" y="407" fill="#3be0a1" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">website</text>
      <rect x="244" y="392" width="82" height="22" rx="11" fill="#0f1b36" stroke="#1c2c50"/>
      <text x="285" y="407" fill="#9fb8ff" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">Play Store</text>
    </g>
    <g>
      <rect x="530" y="330" width="320" height="96" rx="14" fill="url(#jchip)" stroke="#22355f"/>
      <text x="550" y="358" fill="#f4f6fc" font-size="16" font-weight="700">IPU Help</text>
      <text x="830" y="356" fill="#ff354f" font-size="11" text-anchor="end" font-family="ui-monospace,Menlo,monospace">BUILD</text>
      <text x="550" y="382" fill="#8496bd" font-size="12" font-family="ui-monospace,Menlo,monospace">admission &amp; counselling guidance</text>
      <rect x="550" y="392" width="66" height="22" rx="11" fill="#0f1b36" stroke="#1c2c50"/>
      <text x="583" y="407" fill="#3be0a1" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">website</text>
    </g>
    <g>
      <rect x="150" y="446" width="320" height="96" rx="14" fill="url(#jchip)" stroke="#22355f"/>
      <text x="170" y="474" fill="#f4f6fc" font-size="16" font-weight="700">Cyber Sakhi</text>
      <text x="450" y="472" fill="#ff354f" font-size="11" text-anchor="end" font-family="ui-monospace,Menlo,monospace">INNOVATE</text>
      <text x="170" y="498" fill="#8496bd" font-size="12" font-family="ui-monospace,Menlo,monospace">AI digital-safety companion (SIH)</text>
      <rect x="170" y="508" width="58" height="22" rx="11" fill="#0f1b36" stroke="#1c2c50"/>
      <text x="199" y="523" fill="#9fb8ff" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">repo</text>
      <rect x="236" y="508" width="92" height="22" rx="11" fill="#0f1b36" stroke="#1c2c50"/>
      <text x="282" y="523" fill="#9fb8ff" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">live website</text>
    </g>
    <g>
      <rect x="530" y="446" width="320" height="96" rx="14" fill="url(#jchip)" stroke="#22355f"/>
      <text x="550" y="474" fill="#f4f6fc" font-size="16" font-weight="700">Petro Forge</text>
      <text x="830" y="472" fill="#ff354f" font-size="11" text-anchor="end" font-family="ui-monospace,Menlo,monospace">INNOVATE</text>
      <text x="550" y="498" fill="#8496bd" font-size="12" font-family="ui-monospace,Menlo,monospace">industrial AI digital twin (SIH)</text>
      <rect x="550" y="508" width="58" height="22" rx="11" fill="#0f1b36" stroke="#1c2c50"/>
      <text x="579" y="523" fill="#9fb8ff" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">repo</text>
      <rect x="616" y="508" width="92" height="22" rx="11" fill="#0f1b36" stroke="#1c2c50"/>
      <text x="662" y="523" fill="#9fb8ff" font-size="11" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">live website</text>
    </g>
  </g>
</svg>
