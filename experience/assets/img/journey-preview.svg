<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Preview of the interactive developer journey tree">
  <title>My developer journey — interactive tree</title>
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b3a"/><stop offset="1" stop-color="#070b16"/></linearGradient>
    <linearGradient id="jborder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff" stop-opacity=".9"/><stop offset="1" stop-color="#ff354f" stop-opacity=".7"/></linearGradient>
    <linearGradient id="jspine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
    <linearGradient id="jchip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16294f"/><stop offset="1" stop-color="#0a1428"/></linearGradient>
    <pattern id="jdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".05"/></pattern>
    <filter id="jblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect x="0" y="0" width="1000" height="620" rx="26" fill="url(#jbg)"/>
  <rect x="0" y="0" width="1000" height="620" rx="26" fill="url(#jdots)"/>
  <rect x=".75" y=".75" width="998.5" height="618.5" rx="26" fill="none" stroke="url(#jborder)" stroke-width="1.5"/>

  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <circle cx="44" cy="40" r="6" fill="#ff354f"/><circle cx="66" cy="40" r="6" fill="#5a6c96"/><circle cx="88" cy="40" r="6" fill="#247bff"/>
    <text x="112" y="45" font-size="15" fill="#6f83ad" letter-spacing="3">MY JOURNEY &#183; LEARN &#8594; INNOVATE</text>
    <text x="956" y="45" font-size="13" fill="#5b8bff" text-anchor="end">click a project node</text>
  </g>

  <!-- foundation -->
  <ellipse cx="500" cy="92" rx="120" ry="16" fill="#247bff" opacity=".5" filter="url(#jblur)"/>
  <rect x="392" y="80" width="216" height="34" rx="17" fill="#0d1730" stroke="#22355f"/>
  <text x="500" y="102" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#9fb8ff" text-anchor="middle" letter-spacing="2">FOUNDATION</text>

  <!-- spine -->
  <rect x="498.5" y="114" width="3" height="150" fill="url(#jspine)"/>

  <!-- milestones -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14">
    <g>
      <circle cx="500" cy="140" r="9" fill="#0c1428" stroke="#247bff" stroke-width="4"/>
      <rect x="230" y="124" width="236" height="34" rx="12" fill="url(#jchip)" stroke="#22355f"/>
      <text x="248" y="146" fill="#f4f6fc" font-weight="700" font-family="Segoe UI,system-ui,sans-serif" font-size="15">Java</text>
      <text x="450" y="146" fill="#8496bd" text-anchor="end" font-size="12">fundamentals</text>
      <line x1="466" y1="141" x2="491" y2="141" stroke="#247bff" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="500" cy="184" r="9" fill="#0c1428" stroke="#247bff" stroke-width="4"/>
      <rect x="534" y="168" width="276" height="34" rx="12" fill="url(#jchip)" stroke="#22355f"/>
      <text x="552" y="190" fill="#f4f6fc" font-weight="700" font-family="Segoe UI,system-ui,sans-serif" font-size="15">DSA</text>
      <text x="794" y="190" fill="#8496bd" text-anchor="end" font-size="12">Coding Blocks, Noida</text>
      <line x1="509" y1="185" x2="534" y2="185" stroke="#247bff" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="500" cy="228" r="9" fill="#0c1428" stroke="#247bff" stroke-width="4"/>
      <rect x="230" y="212" width="236" height="34" rx="12" fill="url(#jchip)" stroke="#22355f"/>
      <text x="248" y="234" fill="#f4f6fc" font-weight="700" font-family="Segoe UI,system-ui,sans-serif" font-size="15">LeetCode</text>
      <text x="450" y="234" fill="#5b8bff" text-anchor="end" font-size="12">repo &#8599;</text>
      <line x1="466" y1="229" x2="491" y2="229" stroke="#247bff" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="500" cy="272" r="9" fill="#0c1428" stroke="#247bff" stroke-width="4"/>
      <rect x="534" y="256" width="236" height="34" rx="12" fill="url(#jchip)" stroke="#22355f"/>
      <text x="552" y="278" fill="#f4f6fc" font-weight="700" font-family="Segoe UI,system-ui,sans-serif" font-size="15">Python</text>
      <text x="754" y="278" fill="#5b8bff" text-anchor="end" font-size="12">repo &#8599;</text>
      <line x1="509" y1="273" x2="534" y2="273" stroke="#247bff" stroke-width="1.5"/>
    </g>
  </g>

  <!-- branch split -->
  <rect x="498.5" y="290" width="3" height="26" fill="#ff354f"/>
  <path d="M130,316 L870,316" stroke="#ff354f" stroke-width="2" opacity=".6"/>
  <g stroke="#22355f" stroke-width="2">
    <line x1="250" y1="316" x2="250" y2="330"/><line x1="500" y1="316" x2="500" y2="330"/>
    <line x1="750" y1="316" x2="750" y2="330"/><line x1="360" y1="316" x2="360" y2="330"/>
  </g>

